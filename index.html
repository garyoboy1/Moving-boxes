<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Manifest — Box Inventory</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manifest">
<meta name="theme-color" content="#20233A">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  :root{
    --ink:#20233A;
    --ink-soft:#4A4E68;
    --paper:#EEEAE0;
    --card:#FBFAF6;
    --kraft:#B98A55;
    --kraft-dark:#8C6A3F;
    --tape:#E8B324;
    --tape-dark:#C4930F;
    --line:#D8D2C2;
    --danger:#B4432F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .stencil{
    font-family:'Oswald',sans-serif; text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }

  #app{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:90px; }

  /* HEADER */
  header{
    background:var(--ink); color:var(--paper); padding:22px 18px 26px;
    position:relative; overflow:hidden;
  }
  header::after{
    content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
    background:repeating-linear-gradient(45deg, var(--tape) 0 10px, transparent 10px 20px);
    opacity:0.12; border-radius:50%;
  }
  header h1{
    font-size:30px; margin:0 0 2px; font-weight:700; letter-spacing:0.04em;
  }
  header p{ margin:0; color:#C7C9DA; font-size:13px; }

  .searchbar{
    margin:14px 18px 0; background:var(--card); border-radius:12px;
    display:flex; align-items:center; padding:10px 14px; box-shadow:0 2px 8px rgba(0,0,0,0.18);
  }
  .searchbar input{
    border:none; outline:none; flex:1; font-family:'Inter'; font-size:15px;
    background:transparent; color:var(--ink); margin-left:10px;
  }
  .searchbar svg{ flex-shrink:0; }

  main{ padding:18px; }

  /* SEARCH RESULTS */
  .item-hit{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .item-hit .name{ font-size:14.5px; font-weight:500; }
  .item-hit .box-tag{
    font-family:'JetBrains Mono'; font-size:12px; font-weight:700; color:var(--kraft-dark);
    background:#F3E4CC; padding:3px 8px; border-radius:6px; white-space:nowrap; margin-left:10px;
  }
  .no-results{ text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:14px; }

  /* GRID */
  .section-label{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft);
    font-weight:600; margin:4px 2px 10px;
  }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .box-card{
    background:var(--card); border-radius:var(--radius); overflow:hidden; cursor:pointer;
    border:1px solid var(--line); position:relative;
    box-shadow:0 2px 6px rgba(32,35,58,0.06);
  }
  .box-card .thumb{
    width:100%; aspect-ratio:1; object-fit:cover; background:#E2DCCB; display:block;
  }
  .box-card .thumb.placeholder{
    display:flex; align-items:center; justify-content:center; color:var(--kraft-dark); opacity:0.5;
  }
  .box-card .meta{ padding:10px 12px 12px; }
  .box-card .num{
    font-family:'Oswald'; font-size:22px; font-weight:700; line-height:1;
    color:var(--ink);
  }
  .box-card .num::before{ content:"№ "; color:var(--kraft-dark); }
  .box-card .room{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .box-card .count{
    position:absolute; top:8px; right:8px; background:var(--ink); color:var(--paper);
    font-family:'JetBrains Mono'; font-size:11px; font-weight:700; padding:3px 7px; border-radius:20px;
  }
  .box-card.is-moved{ opacity:0.55; }
  .box-card .moved-badge{
    position:absolute; top:8px; left:8px; background:#3E7D4C; color:#fff; width:22px; height:22px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
  }

  .header-actions{
    position:absolute; top:22px; right:18px; display:flex; gap:8px; z-index:2;
  }
  .header-actions button{
    background:rgba(255,255,255,0.1); border:none; color:var(--paper); width:36px; height:36px;
    border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* CHECKLIST */
  .overall-progress{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:18px;
  }
  .overall-progress .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .overall-progress .row .label{ font-family:'Oswald'; font-size:15px; letter-spacing:0.02em; }
  .overall-progress .row .frac{ font-family:'JetBrains Mono'; font-size:13px; color:var(--ink-soft); }
  .progress-track{ height:8px; background:#E4DECD; border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--kraft); border-radius:6px; transition:width 0.25s; }

  .room-group{ margin-bottom:20px; }
  .room-group-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:0 2px;
  }
  .room-group-header .room-name{ font-family:'Oswald'; font-size:15px; text-transform:uppercase; letter-spacing:0.04em; }
  .room-group-header .room-frac{ font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-soft); }
  .check-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .check-row.checked{ background:#EFF3EC; border-color:#CFE0CF; }
  .check-box{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--kraft); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .check-row.checked .check-box{ background:#3E7D4C; border-color:#3E7D4C; }
  .check-row .info{ flex:1; }
  .check-row .info .num{ font-family:'JetBrains Mono'; font-weight:700; font-size:14px; }
  .check-row .info .items-count{ font-size:12px; color:var(--ink-soft); }
  .check-row.checked .info .num{ text-decoration:line-through; opacity:0.6; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state svg{ opacity:0.35; margin-bottom:14px; }
  .empty-state h3{ font-family:'Oswald'; color:var(--ink); margin:0 0 6px; font-size:19px; }
  .empty-state p{ margin:0; font-size:14px; }

  /* FAB */
  .fab{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    max-width:520px; width:calc(100% - 36px);
    display:flex; gap:10px; z-index:20;
  }
  .fab button{
    flex:1; border:none; border-radius:14px; padding:15px; font-family:'Oswald';
    font-size:15px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .fab .primary{ background:var(--tape); color:var(--ink); }
  .fab .secondary{ background:var(--ink); color:var(--paper); }

  /* FORM / DETAIL VIEWS */
  .view-header{
    display:flex; align-items:center; gap:12px; padding:16px 18px; background:var(--card);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
  }
  .back-btn{
    background:none; border:none; cursor:pointer; padding:4px; color:var(--ink); display:flex;
  }
  .view-header h2{ font-family:'Oswald'; font-size:19px; margin:0; flex:1; }

  .form-body{ padding:18px; }
  label.field-label{
    display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); font-weight:600; margin:0 0 6px;
  }
  .field{ margin-bottom:18px; }
  input[type=text], input[type=number]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-family:'Inter'; font-size:15px; color:var(--ink); outline:none;
  }
  input[type=text]:focus, input[type=number]:focus{ border-color:var(--kraft); }

  .photo-drop{
    border:2px dashed var(--line); border-radius:var(--radius); background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px 10px; color:var(--ink-soft); cursor:pointer; position:relative; overflow:hidden;
    min-height:160px;
  }
  .photo-drop img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-drop .overlay-text{
    position:relative; z-index:1; font-size:13px; font-weight:600; background:rgba(32,35,58,0.75);
    color:#fff; padding:6px 12px; border-radius:20px;
  }
  .photo-drop input{ display:none; }

  .item-input-row{ display:flex; gap:8px; }
  .item-input-row input{ flex:1; }
  .item-input-row button{
    background:var(--ink); color:var(--paper); border:none; border-radius:10px;
    width:46px; font-size:20px; cursor:pointer; flex-shrink:0;
  }
  .items-list{ margin-top:12px; }
  .item-row{
    display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line);
  }
  .item-thumb{
    width:44px; height:44px; border-radius:9px; flex-shrink:0; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    border:1.5px dashed var(--kraft); color:var(--kraft-dark); background:#F3E4CC;
  }
  .item-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .item-thumb.empty{ opacity:0.75; }
  .item-thumb input{ display:none; }
  .item-name{ flex:1; font-size:14.5px; }
  .item-remove{
    background:none; border:none; color:var(--ink-soft); font-size:19px; cursor:pointer; padding:4px 6px;
    flex-shrink:0;
  }

  .item-thumb-view{ width:38px; height:38px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; }
  .item-bullet{ width:6px; height:6px; border-radius:50%; background:var(--kraft-dark); flex-shrink:0; }
  .hit-thumb{ width:24px; height:24px; border-radius:6px; object-fit:cover; vertical-align:middle; margin-right:7px; }

  .transfer-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .transfer-card h3{ font-family:'Oswald'; font-size:16px; margin:0 0 6px; letter-spacing:0.02em; }
  .transfer-card p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.5; }
  .transfer-btn{
    width:100%; padding:14px; border:none; border-radius:12px; font-family:'Oswald'; font-size:14.5px;
    font-weight:600; letter-spacing:0.03em; text-transform:uppercase; cursor:pointer; margin-bottom:8px;
  }
  .transfer-btn.gold{ background:var(--tape); color:var(--ink); }
  .transfer-btn.ink{ background:var(--ink); color:var(--paper); }
  .transfer-btn.outline{ background:none; border:1.5px solid var(--line); color:var(--ink); }
  .transfer-btn:last-child{ margin-bottom:0; }
  .import-preview{
    background:#F3E4CC; border-radius:10px; padding:12px 14px; font-size:13.5px; color:var(--kraft-dark);
    margin-bottom:12px; font-weight:500;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(10,11,20,0.92); display:none; align-items:center;
    justify-content:center; z-index:100; padding:24px;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:12px; }

  .contents-list{ list-style:none; margin:0; padding:0; }
  .contents-list li{
    padding:10px 4px; border-bottom:1px solid var(--line); font-size:15px; display:flex;
    align-items:center; gap:10px;
  }

  .save-btn{
    width:100%; padding:16px; border:none; border-radius:14px; background:var(--tape);
    color:var(--ink); font-family:'Oswald'; font-size:16px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase; cursor:pointer; margin-top:6px;
  }
  .delete-link{
    display:block; text-align:center; color:var(--danger); font-size:13.5px; font-weight:600;
    margin-top:16px; cursor:pointer; background:none; border:none; width:100%; padding:8px;
  }

  /* DETAIL */
  .detail-photo{ width:100%; aspect-ratio:4/3; object-fit:cover; background:#E2DCCB; display:block; }
  .detail-body{ padding:20px 18px 0; }
  .stamp-row{ display:flex; align-items:baseline; justify-content:space-between; }
  .stamp{
    font-family:'Oswald'; font-size:40px; font-weight:700; color:var(--ink); line-height:1;
  }
  .stamp span{ color:var(--kraft-dark); font-size:22px; }
  .room-tag{
    font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em;
    font-weight:600; margin-top:4px;
  }
  .divider{ border:none; border-top:1px dashed var(--line); margin:18px 0; }

  .qr-block{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; text-align:center; margin:18px 0;
  }
  .qr-block .qr-canvas{ display:flex; justify-content:center; margin-bottom:10px; }
  .qr-block .qr-code-text{ font-family:'JetBrains Mono'; font-weight:700; font-size:14px; letter-spacing:0.05em; }
  .qr-block .qr-hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .action-row{ display:flex; gap:10px; margin:0 0 24px; }
  .action-row button{
    flex:1; padding:13px; border-radius:12px; font-family:'Oswald'; font-size:14px;
    font-weight:600; letter-spacing:0.03em; text-transform:uppercase; cursor:pointer; border:none;
  }
  .action-row .edit-btn{ background:var(--ink); color:var(--paper); }
  .action-row .print-btn{ background:var(--tape); color:var(--ink); }

  /* SCAN VIEW */
  .scan-wrap{ padding:18px; }
  .scan-video-box{
    position:relative; border-radius:var(--radius); overflow:hidden; background:#000;
    aspect-ratio:1; margin-bottom:14px;
  }
  .scan-video-box video{ width:100%; height:100%; object-fit:cover; }
  .scan-frame{
    position:absolute; inset:15%; border:3px solid var(--tape); border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,0.35);
  }
  .scan-status{ text-align:center; font-size:13.5px; color:var(--ink-soft); margin-bottom:16px; }
  .manual-entry{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .manual-entry .item-input-row{ margin-top:8px; }

  /* PRINT */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block; position:fixed; top:0; left:0; width:100%; text-align:center; padding-top:40px;
    }
    #printArea .p-num{ font-family:'Oswald'; font-size:64px; font-weight:700; margin-bottom:10px; }
    #printArea .p-qr{ display:flex; justify-content:center; margin:10px 0; }
    #printArea .p-room{ font-family:'Inter'; font-size:18px; color:#333; }
  }
  .save-toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:100px; z-index:50;
    max-width:calc(520px - 36px); width:calc(100% - 36px);
    background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:12px;
    font-size:13.5px; display:none; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }
  .save-toast.show{ display:flex; }
  .save-toast.err{ background:var(--danger); }
  .save-toast button{
    background:rgba(255,255,255,0.18); color:#fff; border:none; padding:6px 12px; border-radius:8px;
    font-size:12.5px; font-weight:600; cursor:pointer; flex-shrink:0;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="saveToast" class="save-toast"></div>
<div id="printArea">
  <div class="p-num" id="printNum"></div>
  <div class="p-qr" id="printQr"></div>
  <div class="p-room" id="printRoom"></div>
</div>
<div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src=""></div>

<script>
const ICONS = {
  search: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>`,
  back: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  box: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8.5l-9-4.5-9 4.5v7l9 4.5 9-4.5v-7z"/><path d="M12 4v16"/><path d="M3 8.5l9 4.5 9-4.5"/></svg>`,
  camera: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  qr: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><rect x="19" y="19" width="2" height="2"/><rect x="14" y="19" width="2" height="2"/><rect x="19" y="14" width="2" height="2"/></svg>`,
  plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  clipboard: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 011 1v2H8V3a1 1 0 011-1z"/><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>`,
  download: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  transfer: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v12"/><path d="M3 11l4 4 4-4"/><path d="M17 21V9"/><path d="M21 13l-4-4-4 4"/></svg>`
};

// --- Local storage layer (IndexedDB) — each device keeps its own data; use Export/Import to move data between devices ---
const DB_NAME = 'manifestDB', STORE_NAME = 'kv';
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,'readonly');
    const r = tx.objectStore(STORE_NAME).get(key);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}
async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}

let state = {
  boxes: [],
  view: 'list',      // list | form | detail | scan | checklist
  currentId: null,
  search: '',
  draft: null,
  loaded: false
};
let scanStream = null;
let scanRAF = null;

function migrateBox(b){
  if(b.moved===undefined) b.moved = false;
  if(!b.createdAt){
    const ts = parseInt((b.id||'').replace('b',''),10);
    b.createdAt = new Date(isNaN(ts)?Date.now():ts).toISOString();
  }
  b.items = (b.items||[]).map(it => typeof it === 'string'
    ? { id: 'i'+Math.random().toString(36).slice(2), name: it, photo: null }
    : it);
  return b;
}

async function loadBoxes(){
  try{
    const val = await idbGet('boxes');
    state.boxes = val ? JSON.parse(val) : [];
  }catch(e){ state.boxes = []; }
  state.boxes.forEach(migrateBox);
  state.loaded = true;
  render();
}
async function saveBoxes(){
  showToast('Saving…', false, null, false);
  const sizeKB = Math.round(JSON.stringify(state.boxes).length / 1024);
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const res = await idbSet('boxes', JSON.stringify(state.boxes));
      if(!res) throw new Error('empty response');
      hideToast();
      return true;
    }catch(e){
      console.error('save attempt', attempt, e);
      if(attempt<3){ await new Promise(r=>setTimeout(r, 400*attempt)); continue; }
      showToast(`Couldn't save (data ~${sizeKB}KB). Storage may be full.`, true, saveBoxes);
      return false;
    }
  }
}

function showToast(msg, isError, retryFn, autoHide){
  const t = document.getElementById('saveToast');
  t.className = 'save-toast show' + (isError?' err':'');
  t.innerHTML = `<span>${escapeHtml(msg)}</span>` + (retryFn ? `<button id="toastRetryBtn">Retry</button>` : '');
  if(retryFn){
    document.getElementById('toastRetryBtn').onclick = ()=>{ retryFn(); };
  }
  if(autoHide!==false && !isError){
    clearTimeout(showToast._t);
    showToast._t = setTimeout(hideToast, 1500);
  }
}
function hideToast(){
  const t = document.getElementById('saveToast');
  t.className = 'save-toast';
}

function nextBoxNumber(){
  if(!state.boxes.length) return 1;
  return Math.max(...state.boxes.map(b=>b.number)) + 1;
}
function pad(n){ return n.toString().padStart(3,'0'); }
function qrValue(number){ return 'BOX-' + pad(number); }
function parseQrValue(text){
  const m = text.trim().toUpperCase().match(/(\d{1,6})/);
  return m ? parseInt(m[1],10) : null;
}

function goList(){ stopScan(); state.view='list'; state.currentId=null; render(); }
function goNew(){
  stopScan();
  state.draft = { id: 'b'+Date.now(), number: nextBoxNumber(), room:'', photo:null, items:[], moved:false, createdAt: new Date().toISOString() };
  state.view='form'; render();
}
function goEdit(id){
  stopScan();
  const b = state.boxes.find(x=>x.id===id);
  state.draft = JSON.parse(JSON.stringify(b));
  state.view='form'; render();
}
function goDetail(id){ stopScan(); state.currentId=id; state.view='detail'; render(); }
function goScan(){ state.view='scan'; render(); startScan(); }
function goChecklist(){ stopScan(); state.view='checklist'; render(); }
function goTransfer(){ stopScan(); state.pendingImport = null; state.view='transfer'; render(); }

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = `<div style="padding:60px;text-align:center;color:var(--ink-soft)">Loading manifest…</div>`; return; }
  if(state.view==='list') return renderList(app);
  if(state.view==='form') return renderForm(app);
  if(state.view==='detail') return renderDetail(app);
  if(state.view==='scan') return renderScan(app);
  if(state.view==='checklist') return renderChecklist(app);
  if(state.view==='transfer') return renderTransfer(app);
}

  boxes.forEach(b=>{

  });

    return a.localeCompare(b);
  });

  let html = `
    <div class="view-header">
      <button class="back-btn" onclick="goList()">${ICONS.back}</button>

    html += `<div class="empty-state"><h3>Nothing to check off yet</h3><p>Pack a box first and it'll show up here.</p></div>`;

function exportBackup(){
  if(state.boxes.length===0){ alert('No boxes packed yet — nothing to export.'); return; }
  const blob = new Blob([JSON.stringify(state.boxes, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'manifest-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function onImportFileChosen(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed)) throw new Error('not an array');
      parsed.forEach(migrateBox);
      state.pendingImport = parsed;
      render();
    }catch(err){
      alert("That doesn't look like a valid Manifest backup file.");
    }
  };
  reader.readAsText(file);
}

async function applyImport(mode){
  const incoming = state.pendingImport;
  if(!incoming) return;
  if(mode === 'replace'){
    if(!confirm('Replace all boxes on this device with the imported file? This cannot be undone.')) return;
    state.boxes = incoming;
  } else {
    const existingIds = new Set(state.boxes.map(b=>b.id));
    const toAdd = incoming.filter(b=>!existingIds.has(b.id));
    state.boxes = state.boxes.concat(toAdd);
  }
  state.pendingImport = null;
  await saveBoxes();
  goList();
}

async function toggleMoved(id){
  const b = state.boxes.find(x=>x.id===id);
  if(!b) return;
  b.moved = !b.moved;
  await saveBoxes();
  render();
}

function exportCSV(){
  if(state.boxes.length===0){ alert('No boxes packed yet — nothing to export.'); return; }
  const rows = [['Box Number','Room / Destination','Item','Item Photo','Items In Box','Status','Date Packed']];
  state.boxes.slice().sort((a,b)=>a.number-b.number).forEach(b=>{
    const dateStr = b.createdAt ? new Date(b.createdAt).toLocaleDateString() : '';
    const status = b.moved ? 'Loaded / Delivered' : 'Packed';
    if(b.items.length===0){
      rows.push([pad(b.number), b.room||'', '', '', '0', status, dateStr]);
    } else {
      b.items.forEach(it=>{
        rows.push([pad(b.number), b.room||'', it.name, it.photo?'Yes':'No', String(b.items.length), status, dateStr]);
      });
    }
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'moving-inventory-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function manualJump(){
  const val = document.getElementById('manualBox').value;
  const num = parseQrValue(val);
  const b = state.boxes.find(x=>x.number===num);
  if(b) goDetail(b.id);
  else {
    const status = document.getElementById('scanStatus');
    if(status){ status.textContent = `No box № ${val} found.`; status.style.color = 'var(--danger)'; }
  }
}

async function startScan(){
  const video = document.getElementById('scanVideo');
  const status = document.getElementById('scanStatus');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const tick = ()=>{
      if(state.view!=='scan') return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);
        if(code && code.data){
          const num = parseQrValue(code.data);
          const b = state.boxes.find(x=>x.number===num);
          if(b){ goDetail(b.id); return; }
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    if(status){ status.textContent = "Camera unavailable — use manual entry below."; status.style.color='var(--ink-soft)'; }
  }
}
function stopScan(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}

function compressImageFile(file, maxW, targetBytes){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);

        // Iteratively shrink quality/size until the encoded image is a safe size
        let quality = 0.7;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        let estBytes = dataUrl.length * 0.75;
        let tries = 0;
        while(estBytes > targetBytes && tries < 6){
          if(quality > 0.35){ quality -= 0.1; }
          else { w = Math.round(w*0.85); h = Math.round(h*0.85); canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); }
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          estBytes = dataUrl.length * 0.75;
          tries++;
        }
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

}
async function deleteBox(id){
  if(!confirm('Delete this box and its contents list? This cannot be undone.')) return;
  state.boxes = state.boxes.filter(b=>b.id!==id);
  await saveBoxes();
  goList();
}

function printLabel(id){
  const b = state.boxes.find(x=>x.id===id);
  document.getElementById('printNum').textContent = 'BOX ' + pad(b.number);
  document.getElementById('printRoom').textContent = b.room || '';
  const qrHost = document.getElementById('printQr');
  qrHost.innerHTML = '';
  new QRCode(qrHost, { text: qrValue(b.number), width:220, height:220, colorDark:"#000000", colorLight:"#ffffff" });
  setTimeout(()=>window.print(), 150);
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

loadBoxes();
</script>
